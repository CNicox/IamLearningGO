volumes:
  postgres_data_gin:


services:
  postgres:
    image: postgres:16.2
    container_name: postgres_gin
    volumes:
      - postgres_data_gin:/var/lib/postgresql/data
    ports:
      - 127.0.0.1:5433:5432
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB_NAME}